<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机登录助手</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12100d;color:#eee8dc;font:16px/1.7 system-ui,sans-serif}.card{width:min(540px,calc(100% - 64px));padding:28px;border:1px solid #78613a;border-radius:20px;background:#201b14}h1{font-size:24px;margin:0 0 16px}p{overflow-wrap:anywhere}.site{color:#d8b775}button{min-height:44px;padding:10px 22px;border:1px solid #a8874e;border-radius:10px;color:#eee8dc;background:#3b2e1b;cursor:pointer}button:disabled{opacity:.5;cursor:default}.note{color:#b8ae9d;font-size:14px}:focus-visible{outline:3px solid #e2c37e;outline-offset:3px}</style></head>
<body><main class="card"><h1>本机登录助手</h1><p id="status" role="status" aria-live="polite">正在连接本机助手…</p><p class="site" id="site"></p><p class="note">请在你电脑上新打开的抖音窗口完成本人登录。成功后自动关闭登录窗口，提取结果只保存到本机。</p><p class="note" id="saved-path"></p><button id="download" hidden>下载 state.json</button> <button id="cancel" disabled>取消本次登录</button><p class="note">网站只接收状态和数量。需要接入网站时，请你手动选择导出的文件上传。关闭此页面会取消未完成的登录。</p></main>
<script>
(()=>{'use strict';let config=null,jobId=null,requestId=null,pendingRequestId=null,pendingCancelled=false,busy=false,poll=null,lastStatus=null;const status=document.getElementById('status'),cancel=document.getElementById('cancel'),download=document.getElementById('download');
const labels={idle:'等待网站发起登录。',starting:'正在打开本机浏览器…',waiting:'请在新打开的抖音窗口完成本人登录。',saving:'浏览器已关闭，正在本机保存登录凭据…',success:'登录凭据已保存到本机。需要接入网站时，请你手动上传。',cancelled:'本次登录已取消。',timeout:'登录已超时，请回到网站重试。',failed:'本次登录未完成，请回到网站重试。',stopping:'正在关闭浏览器并清理本机临时数据…'};
function send(type,payload){if(config&&window.opener)window.opener.postMessage({type,payload},config.trusted_origin);}
function safeProgress(data){return{request_id:requestId,job_id:jobId,status:data.status,count:Number.isInteger(data.count)?data.count:0,error:data.error||null};}
function show(data){status.textContent=labels[data.status]||'本机助手状态暂时不可用。';cancel.disabled=!data.running;download.hidden=!(data.status==='success'&&data.download_ready);document.getElementById('saved-path').textContent=data.saved_path?'本机保存位置：'+data.saved_path:'';if(jobId&&data.status!==lastStatus){lastStatus=data.status;send('sparkkeeper-local-cookie-progress',safeProgress(data));}}
async function request(path,body){const options=body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json','X-Helper-Nonce':config.page_nonce},body:JSON.stringify(body),cache:'no-store'};const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw new Error(data.error||'helper_failed');return data;}
async function cancelJob(){if(!jobId){if(busy&&pendingRequestId){pendingCancelled=true;cancel.disabled=true;status.textContent='正在取消本次登录…';}return;}cancel.disabled=true;try{show(await request('/helper/cancel',{request_id:requestId,job_id:jobId}));}catch{status.textContent='正在等待本机助手关闭登录窗口…';}}
window.addEventListener('message',async event=>{if(!config||event.origin!==config.trusted_origin||event.source!==window.opener)return;const message=event.data,payload=message&&message.payload;if(!message||!payload)return;if(message.type==='sparkkeeper-local-cookie-cancel'){if(!jobId&&busy&&payload.request_id===pendingRequestId){pendingCancelled=true;cancel.disabled=true;status.textContent='正在取消本次登录…';}else if(payload.request_id===requestId&&payload.job_id===jobId)await cancelJob();return;}if(message.type!=='sparkkeeper-local-cookie-start'||payload.origin!==config.trusted_origin)return;if(busy||jobId){if(payload.request_id===requestId&&jobId)send('sparkkeeper-local-cookie-ack',{request_id:requestId,job_id:jobId,ok:true});return;}busy=true;pendingRequestId=payload.request_id;pendingCancelled=false;status.textContent='正在打开本机浏览器…';cancel.disabled=false;try{const result=await request('/helper/extract',{origin:config.trusted_origin,request_id:pendingRequestId,deadline:payload.deadline});requestId=pendingRequestId;jobId=result.job_id;send('sparkkeeper-local-cookie-ack',{request_id:requestId,job_id:jobId,ok:true});if(pendingCancelled)await cancelJob();else show(result);poll=setInterval(async()=>{try{const data=await request('/helper/status');if(data.job_id===jobId&&data.request_id===requestId){show(data);if(!data.running)clearInterval(poll);}}catch{status.textContent='本机助手连接中断，请检查助手窗口。';}},1000);}catch(error){status.textContent='无法开始登录，请检查本机助手配置或回到网站重试。';send('sparkkeeper-local-cookie-error',{request_id:pendingRequestId,job_id:jobId,ok:false,error:error.message});}finally{busy=false;pendingRequestId=null;}});
cancel.addEventListener('click',cancelJob);
download.addEventListener('click',async()=>{if(!config||!jobId)return;try{const response=await fetch('/helper/download/'+encodeURIComponent(jobId),{headers:{'X-Helper-Nonce':config.page_nonce},cache:'no-store'});if(!response.ok)throw new Error();const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='state.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch{status.textContent='本机文件下载失败，请从上方保存位置选择文件。';}});
window.addEventListener('pagehide',()=>{if(config&&jobId)fetch('/helper/cancel',{method:'POST',headers:{'Content-Type':'application/json','X-Helper-Nonce':config.page_nonce},body:JSON.stringify({request_id:requestId,job_id:jobId}),keepalive:true}).catch(()=>{});});
(async()=>{try{config=await request('/helper/config');const claimed=new URLSearchParams(location.hash.slice(1)).get('origin');document.getElementById('site').textContent='允许发起登录的网站：'+config.trusted_origin;if(claimed!==config.trusted_origin||!window.opener){status.textContent='请从已允许的网站点击“提取登录凭据”打开此页面。';config=null;return;}show(config.status);send('sparkkeeper-local-cookie-ready',{origin:config.trusted_origin});}catch{status.textContent='无法连接本机助手，请先运行“启动本地Cookie助手.bat”。';}})();
})();
</script></body></html>
